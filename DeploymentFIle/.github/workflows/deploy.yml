name: Deploy showcase to GitHub Pages

# This workflow is meant for a SEPARATE site repo whose root holds index.html.
# Pushing to main publishes the page automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site automatically if it isn't already,
          # instead of failing with "Get Pages site failed / Not Found".
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # index.html sits at the repo root
      - id: deployment
        uses: actions/deploy-pages@v4
